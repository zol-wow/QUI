name: Regenerate Search Cache

# Auto-regenerates QUI_Options/search_cache.lua on every push to
# beta or alpha and commits the result back to the branch.
#
# Scoped to the working branches on purpose. main keeps the hard staleness
# gate in lua-tests.yml, so a stale cache can never land there; beta and
# alpha get the cache fixed for them instead. The gate is switched off on
# exactly these two branches — if it ran here too the two would fight, the
# gate reddening the push and this bot's follow-up commit turning it green.
# Keep the branch list here and the exclusion in lua-tests.yml in sync.
#
# Loop prevention: pushes made with the default GITHUB_TOKEN do NOT
# trigger further workflow runs (per GitHub's default policy). The
# `[skip ci]` tag on the commit message is belt-and-suspenders for any
# CI that observes that convention.

on:
  push:
    branches:
      - beta
      - alpha

# Shared with regen-i18n-base.yml. Both bots fire on the same push to beta or
# alpha and both commit to that branch, so without a common group they race and
# whichever pushes second is rejected as non-fast-forward. Same group name plus
# cancel-in-progress: false queues them instead. The checkout below then takes
# the branch tip rather than the triggering SHA, so the queued run builds on the
# other bot's commit instead of forking from underneath it.
concurrency:
  group: regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if last commit was made by this workflow
        id: bot-check
        run: |
          AUTHOR=$(git log -1 --pretty=%an)
          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "Last commit is from the regen bot; skipping to avoid noisy no-op runs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua 5.1
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Regenerate search cache
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          lua5.1 tools/generate_search_cache.lua
          lua5.1 tools/audit_search_cache.lua

      - name: Commit and push if cache changed
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          if git diff --quiet -- QUI_Options/search_cache.lua; then
            echo "Search cache is already up to date; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QUI_Options/search_cache.lua
          git commit -m "chore(options): regenerate search cache [skip ci]"
          git push
