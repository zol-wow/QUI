name: taint-check

on:
  pull_request:
  push:

jobs:
  self-test:
    name: Analyzer self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - name: Run analyzer self-test
        run: lua tools/test_taint.lua --self-test
      - name: Analyzer unit tests
        run: |
          set -u
          fail=0
          for t in tests/taint/*_test.lua tests/taint/parser/parser_test.lua; do
            echo "::group::$t"
            if lua "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::Test failed"
              fail=1
            fi
          done
          exit $fail

  api-index-sync:
    name: api-index in sync with corpus
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - name: Regenerate client indexes and definitions
        run: |
          lua tools/test_taint.lua --update-index
          lua tools/generate_lua_definitions.lua
          lua tools/test_taint.lua --update-index --corpus tests/clients/forever/api-docs/blizzard --index tests/clients/forever/api-docs/api-index.lua
          lua tools/generate_lua_definitions.lua --docs tests/clients/forever/api-docs/blizzard --out tests/clients/forever/meta --globals none
      - name: Verify no diff
        run: |
          git -C tests diff --exit-code -- api-docs/api-index.lua clients/forever/api-docs/api-index.lua clients/forever/meta/
          git diff --exit-code -- meta/wow-api.lua meta/wow-widgets.lua meta/wow-globals.lua

  analyze:
    name: Taint analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [retail, forever]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      # Strict findings fail the step via the analyzer's exit code; the
      # advisory set is archived either way, so `if: always()` on the upload
      # keeps the report available on exactly the runs you need it for.
      - name: Analyze ${{ matrix.client }} shard ${{ matrix.shard }}
        run: |
          index=tests/api-docs/api-index.lua
          if [ "${{ matrix.client }}" = forever ]; then
            index=tests/clients/forever/api-docs/api-index.lua
          fi
          lua tools/test_taint.lua \
            --report github --strict-only --index "$index" \
            --json-out taint-report.json \
            --shard ${{ matrix.shard }}/6
      # Each shard uploads its own artifact: actions/upload-artifact rejects a
      # duplicate name, and --json-out covers only this shard's files. Anything
      # consuming these has to concatenate each client's six shards.
      - name: Upload advisory report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taint-report-${{ matrix.client }}-${{ matrix.shard }}
          path: taint-report.json
