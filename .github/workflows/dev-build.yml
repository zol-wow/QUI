name: Dev Build

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'bugfix/*'

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate generated search cache
        run: |
          lua5.1 tools/generate_search_cache.lua
          lua5.1 tools/audit_search_cache.lua
          if ! git diff --quiet -- QUI_OptionsSearch/search_cache.lua; then
            echo "QUI_OptionsSearch/search_cache.lua is stale. Run: lua5.1 tools/generate_search_cache.lua && lua5.1 tools/audit_search_cache.lua"
            git diff -- QUI_OptionsSearch/search_cache.lua
            exit 1
          fi

      - name: Get branch info
        id: info
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "filename=QUI-${SAFE_BRANCH}-${SHORT_SHA}.zip" >> $GITHUB_OUTPUT
          echo "artifact_name=QUI-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create addon zip
        run: |
          set -euo pipefail

          # Discover every shipped sibling addon. A top-level QUI_* folder ships
          # when it has a matching TOC file, e.g. QUI_Bags/QUI_Bags.toc. This
          # mirrors release.yml so dev and release builds stay structurally
          # identical and neither drifts when suite addons are added or merged.
          excluded_suite_folders=(
            QUI_Debug
            QUI_Logger
          )

          common_rsync_excludes=(
            --exclude='.DS_Store'
            --exclude='.git'
            --exclude='.github'
            --exclude='docs'
            --exclude='tests'
            --exclude='tools'
          )

          is_excluded_suite_folder() {
            local candidate="$1"
            local excluded
            for excluded in "${excluded_suite_folders[@]}"; do
              if [[ "$candidate" == "$excluded" ]]; then
                return 0
              fi
            done
            return 1
          }

          suite_folders=()
          while IFS= read -r folder; do
            suite_folders+=("$folder")
          done < <(
            find . -maxdepth 1 -type d -name 'QUI_*' -print \
              | sed 's#^\./##' \
              | while IFS= read -r folder; do
                  if [[ -f "$folder/$folder.toc" ]] && ! is_excluded_suite_folder "$folder"; then
                    printf '%s\n' "$folder"
                  fi
                done \
              | sort
          )

          if [[ ${#suite_folders[@]} -eq 0 ]]; then
            echo "No suite addon folders discovered" >&2
            exit 1
          fi

          echo "Discovered suite folders:"
          printf '  %s\n' "${suite_folders[@]}"

          rm -rf build
          mkdir -p build/QUI
          for folder in "${suite_folders[@]}"; do
            mkdir -p "build/$folder"
          done

          main_root_files=(
            QUI.toc
            init.lua
          )
          main_runtime_dirs=(
            assets
            core
            importstrings
            libs
            modules
          )

          for file in "${main_root_files[@]}"; do
            test -f "$file"
            cp -p "$file" "build/QUI/$file"
          done

          for dir in "${main_runtime_dirs[@]}"; do
            test -d "$dir"
            mkdir -p "build/QUI/$dir"
            rsync -a "${common_rsync_excludes[@]}" "$dir/" "build/QUI/$dir/"
          done

          for folder in "${suite_folders[@]}"; do
            rsync -a "${common_rsync_excludes[@]}" "$folder/" "build/$folder/"
          done

          cp README.md build/QUI/ 2>/dev/null || true
          cp CHANGELOG.md build/QUI/ 2>/dev/null || true
          cp LICENSE build/QUI/ 2>/dev/null || true

          required_paths=(
            build/QUI/QUI.toc
            build/QUI/init.lua
            build/QUI/core/defaults.lua
            build/QUI/libs/LibStub/LibStub.lua
            build/QUI/importstrings/qui_editmode_base.lua
            build/QUI/assets/QUI.tga
            build/QUI_Options/init.lua
            build/QUI_Options/framework.lua
            build/QUI_Options/shared.lua
            build/QUI_Options/tiles/action_bars.lua
          )

          for folder in "${suite_folders[@]}"; do
            required_paths+=("build/$folder/$folder.toc")
            case "$folder" in
              QUI_OptionsSearch*)
                required_paths+=("build/$folder/search_cache.lua")
                ;;
              *)
                required_paths+=("build/$folder/bootstrap.lua")
                ;;
            esac
          done

          for required_path in "${required_paths[@]}"; do
            if [[ ! -e "$required_path" ]]; then
              echo "Missing packaged path: $required_path" >&2
              exit 1
            fi
          done

          forbidden_paths=(
            build/QUI/.git
            build/QUI/.github
            build/QUI/docs
            build/QUI/tests
            build/QUI/tools
            build/QUI/QUI_Debug
            build/QUI/QUI_Logger
            build/QUI_Debug
            build/QUI_Logger
            build/QUI/modules/debug
          )

          for forbidden_path in "${forbidden_paths[@]}"; do
            if [[ -e "$forbidden_path" ]]; then
              echo "Non-runtime path packaged: $forbidden_path" >&2
              exit 1
            fi
          done

          nested_suite="$(find build/QUI -maxdepth 1 -type d -name 'QUI_*' -print | head -n 1)"
          if [[ -n "$nested_suite" ]]; then
            echo "Non-runtime path packaged inside main addon: $nested_suite" >&2
            exit 1
          fi

          rm -f ${{ steps.info.outputs.filename }}
          cd build
          zip -r ../${{ steps.info.outputs.filename }} QUI "${suite_folders[@]}"

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.artifact_name }}
          path: ${{ steps.info.outputs.filename }}
          if-no-files-found: error

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          BRANCH: ${{ steps.info.outputs.branch }}
          SHORT_SHA: ${{ steps.info.outputs.short_sha }}
          FILENAME: ${{ steps.info.outputs.filename }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_DEV_WEBHOOK_URL secret not set — skipping Discord notification."
            exit 0
          fi

          COMMIT_URL="https://github.com/$REPO/commit/$GITHUB_SHA"

          # Truncate commit message to first line
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1)

          BASE_CONTENT="🔧 **Dev Build** — \`$BRANCH\` @ [\`$SHORT_SHA\`]($COMMIT_URL)
          > $FIRST_LINE"

          # Discord webhook file uploads are capped at 25 MiB. When the addon
          # zip exceeds that, post a link to the GitHub artifact download
          # instead of attaching the file. Use a conservative 24 MiB threshold.
          MAX_BYTES=$((24 * 1024 * 1024))
          SIZE=$(stat -c%s "$FILENAME")
          LINK_URL="${ARTIFACT_URL:-$RUN_URL}"

          if [ "$SIZE" -le "$MAX_BYTES" ]; then
            PAYLOAD=$(jq -n --arg content "$BASE_CONTENT" '{ content: $content }')
            echo "$PAYLOAD" > payload.json
            curl --fail-with-body \
              -F "payload_json=<payload.json" \
              -F "file1=@$FILENAME" \
              "$DISCORD_WEBHOOK"
          else
            HUMAN_SIZE=$(numfmt --to=iec --suffix=B "$SIZE" 2>/dev/null || echo "${SIZE} bytes")
            CONTENT="$BASE_CONTENT
          📦 Build is $HUMAN_SIZE (over Discord's upload limit) — [download from GitHub]($LINK_URL)"
            PAYLOAD=$(jq -n --arg content "$CONTENT" '{ content: $content }')
            echo "$PAYLOAD" > payload.json
            curl --fail-with-body \
              -F "payload_json=<payload.json" \
              "$DISCORD_WEBHOOK"
          fi
